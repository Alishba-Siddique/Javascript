<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <title>Car Engine Soundboard</title>
  </head>
  <body>
    <main
      id="bg-image"
      class="bg-image"
      style="background-image: url('./mercedes-bg.jpg')"
    >
      <!-- Heading Text -->
      <div class="title-box">
        <h1>Car Engine Soundboard</h1>
        <p>Tap a car to change the background and hear its engine roar.</p>
      </div>

      <section class="logo-grid">
        <div class="top-row">
          <div
            class="logo-card"
            onclick="changeBgImageAudio('./ferrari-bg.jpg', './ferrari.mp3')"
          >
            <img src="./ferrari.png" alt="Ferrari" />
          </div>

          <div
            class="logo-card"
            onclick="changeBgImageAudio('./mercedes-bg.jpg', './mercedes.mp3')"
          >
            <img src="./mercedes.png" alt="Mercedes" />
          </div>

          <div
            class="logo-card"
            onclick="changeBgImageAudio('./jaguar-bg.jpg', './jaguar.mp3')"
          >
            <img src="./jaguar.png" alt="Jaguar" />
          </div>

          <div
            class="logo-card"
            onclick="changeBgImageAudio('./lamborghini-bg.jpg', './lamborghini.mp3')"
          >
            <img src="./lamborghini.png" alt="Lamborghini" />
          </div>

          <div
            class="logo-card"
            onclick="changeBgImageAudio('./bmw-bg.jpg', './bmw.mp3')"
          >
            <img src="./bmw.png" alt="BMW" />
          </div>

          <div
            class="logo-card"
            onclick="changeBgImageAudio('./tesla-bg.jpg', './tesla.mp3')"
          >
            <img src="./tesla.png" alt="Tesla" />
          </div>
        </div>
        <div class="bottom-row">
          <div
            class="logo-card"
            onclick="changeBgImageAudio('./f1-bg.jpg', './f1.mp3')"
          >
            <img src="./f1.png" alt="F1 Car" />
          </div>

          <div
            class="logo-card"
            onclick="changeBgImageAudio('./rolls-royce-bg.jpg', './rolls-royce.mp3')"
          >
            <img src="./rolls-royce.png" alt="Rolls Royce" />
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
